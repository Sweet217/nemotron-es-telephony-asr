[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esasr"
version = "0.1.0"
description = "Telephony-grade Latin American Spanish ASR evaluation for NVIDIA Nemotron 3.5 ASR"
authors = [{ name = "Gabriel Velázquez" }]
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["slow: loads the 0.6B model (deselect with -m 'not slow')"]
